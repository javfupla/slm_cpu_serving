[project]
name = "slm-cpu-serving"
version = "0.1.0"
description = "Taller: inferencia de modelos de lenguaje pequeños (SLM) en CPU con llama-cpp-python"
readme = "README.md"
authors = [
    { name = "Leonardo Santamarina", email = "Leonardo.Santamarina@nielseniq.com" },
]
requires-python = ">=3.12"
dependencies = [
    "openai>=1.50",
    "llama-cpp-python[server]>=0.3.21",
    "psutil>=6.0",
    "jupyter>=1.1",
]

[project.scripts]
slm-cpu-serving = "slm_cpu_serving:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
# prebuilt CPU wheels (py3-none) avoid compiling llama.cpp from source
llama-cpp-python = { index = "llama-cpp-python-cpu" }

[[tool.uv.index]]
name = "llama-cpp-python-cpu"
url = "https://abetlen.github.io/llama-cpp-python/whl/cpu"
explicit = true
